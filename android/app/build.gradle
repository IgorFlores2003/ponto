apply plugin: 'com.android.application'

def releaseKeys = new Properties()
def releaseKeysFile = rootProject.file('keystore.properties')
if (releaseKeysFile.exists()) {
    releaseKeysFile.withInputStream { releaseKeys.load(it) }
}

android {
    namespace = "com.pontodigital.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pontodigital.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeysFile.exists()) {
                storeFile rootProject.file(releaseKeys.getProperty('storeFile'))
                storePassword releaseKeys.getProperty('storePassword')
                keyAlias releaseKeys.getProperty('keyAlias')
                keyPassword releaseKeys.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseKeysFile.exists() || ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !releaseKeys.getProperty(it) }) {
            throw new GradleException('Configure android/keystore.properties antes de gerar uma versão de lançamento. Veja docs/android-release.md.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn('verifyReleaseSigning') }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Reject an incomplete web bundle before it can produce a blank screen on device.
tasks.register('verifyWebAssets') {
    doLast {
        def webRoot = file('src/main/assets/public')
        def indexFile = new File(webRoot, 'index.html')
        if (!indexFile.isFile()) {
            throw new GradleException('Frontend ausente. Execute npm run android:sync na raiz do projeto.')
        }
        def references = indexFile.getText('UTF-8') =~ /(?:src|href)=["'](?:\.\/|\/)?(assets\/[^"']+)["']/
        references.each { match ->
            if (!new File(webRoot, match[1]).isFile()) {
                throw new GradleException("Asset ausente: ${match[1]}. Execute npm run android:sync na raiz do projeto.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyWebAssets') }
